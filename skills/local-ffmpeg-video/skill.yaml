  rationale: 'Clip 29 evidence shows the gap precisely: the assistant judged joins on a small tiny frame sheet and at full size the seam line was plain (fc3b9ef7), a Kirk listening single around 7.6 seconds was stretched sideways and later measured 71 to 78 percent too wide (2c166fb5), and a posted clip showed a split and other side view (dc95e4eb). The existing local_ffmpeg_video rule required many moments and edge checks but never required full size inspection or a measured aspect comparison against the source, so a downsized sheet could still pass. The repair passed at 0 percent shape error with no line at full size (ec1c759f) and the user approved it (be9ec538), proving the full size gates are the discriminating check. Local computer vision duplicated this verification work with a weaker start, middle and end protocol plus detector stack facts, so its detector facts are carried into this merged skill and it retires in the same batch, reducing the active learned count from 13. Other learned skills were reviewed and kept distinct: the design cluster covers different outputs, research and reel catalog cover different inputs, and no other skill covers full size clip verification.'
